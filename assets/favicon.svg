<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="本棚">
  <!-- Media Library のファビコン。棚板2枚に背表紙を並べた本棚。
       16pxでも形が残るよう、本は少なく太く、色は3色までに絞ってある。
       タブの背景が明るくても暗くても沈まないよう、濃紺の角丸を下地に敷いている。 -->
  <rect width="32" height="32" rx="7" fill="#1f3b6e"/>

  <!-- 上段の背表紙。高さと太さをそろえないほうが本らしく見える -->
  <rect x="5.2"  y="6.6" width="4.4" height="7.8" rx="0.7" fill="#f3ecdb"/>
  <rect x="10.6" y="7.2" width="5.2" height="7.2" rx="0.7" fill="#8fb8ff"/>
  <rect x="16.8" y="6.4" width="4.2" height="8.0" rx="0.7" fill="#f3ecdb"/>
  <rect x="22.0" y="7.0" width="4.8" height="7.4" rx="0.7" fill="#f5b942"/>

  <!-- 上段の棚板 -->
  <rect x="4" y="14.4" width="24" height="2.0" rx="1" fill="#a9bede"/>

  <!-- 下段の背表紙。上段より太い本を並べて、段ごとの表情を変える -->
  <rect x="5.6"  y="17.6" width="6.0" height="7.2" rx="0.7" fill="#f3ecdb"/>
  <rect x="12.6" y="18.0" width="5.4" height="6.8" rx="0.7" fill="#8fb8ff"/>
  <rect x="19.0" y="17.4" width="6.6" height="7.4" rx="0.7" fill="#f3ecdb"/>

  <!-- 下段の棚板 -->
  <rect x="4" y="24.8" width="24" height="2.0" rx="1" fill="#a9bede"/>
</svg>
